name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q patch.zip -d /tmp/x
          cd /tmp/x
          if [ "$(ls -A | wc -l)" = "1" ] && [ -d "$(ls -A | head -n1)" ]; then
            cd "$(ls -A | head -n1)"
          fi
          rsync -a --exclude .github ./ "$GITHUB_WORKSPACE"/
          cd "$GITHUB_WORKSPACE"
          rm -f Android-Telecom-App-master.zip
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply update" || echo "nothing to commit"
          git push
